name: Сбор вакансий

on:
  schedule:
    # 05:00, 11:00, 17:00 UTC = 09:00, 15:00, 21:00 по Еревану
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:
    inputs:
      telegram:
        description: "Отправлять Telegram-уведомления"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vacancies-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Сбор вакансий
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MAX_MESSAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram == false && '0' || '30' }}
        run: python main.py

      - name: Коммит состояния (seen.json, кэш переводов)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json data/translations_cache.json || true
          if git diff --cached --quiet; then
            echo "Изменений состояния нет"
          else
            git commit -m "update: состояние парсера $(date -u +'%Y-%m-%d %H:%M') UTC"
            # прямой push: не мешают незакоммиченные output/ (Pages берёт их из рабочего дерева)
            git push origin HEAD:main \
              || echo "::warning::push состояния не удался (не критично, дельта догонит в следующий раз)"
          fi

      - name: Настройка Pages артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
